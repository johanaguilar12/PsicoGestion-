spring.application.name=psicogestion

# Cargar credenciales privadas
spring.config.import=optional:classpath:application-local.properties

# Configuración base mediante Variables de Entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/psicogestion?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MAR1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081