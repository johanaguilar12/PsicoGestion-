spring.application.name=psicogestion

# Configuración de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/psicogestion?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=MAR1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de Hibernate (validate evita que Spring sobrescriba tu script DDL)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081