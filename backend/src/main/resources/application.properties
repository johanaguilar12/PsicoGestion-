spring.application.name=psicogestion

# Cargar credenciales privadas
spring.config.import=optional:classpath:application-local.properties

# Configuración base mediante Variables de Entorno
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/psicogestion?serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:MAR1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8081

# Autoarranque del frontend (Vite) en la misma terminal
app.frontend.auto-start=true

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:johanricardoaguilar@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:johanricardoaguilar@gmail.com}}
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}